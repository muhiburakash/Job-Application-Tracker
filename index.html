<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Job Application Tracker</title>
  <link rel="shortcut icon" href="assets/logo.png" type="image/x-icon">

  <!-- Tailwind and Daisy -->
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <!-- font  -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet">

  <!-- icon -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />

  <style>
    * {
      font-family: "Geist", sans-serif;
    }
  </style>

</head>

<body class="bg-gray-100 min-h-screen">

  <!-- Header -->
  <header class="container mx-auto pt-[60px] pb-[20px] px-5 ">
    <h1 class="text-3xl font-bold">Job Application Tracker</h1>
  </header>

  <main class="container mx-auto px-5">

    <!-- Dashboard -->
    <section class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <div class="card bg-white p-4">
        <p class="text-black">Total</p>
        <p id="totalCount" class="text-2xl font-bold">0</p>
      </div>
      <div class="card bg-white  p-4">
        <p class="text-black">Interview</p>
        <p id="interviewCount" class="text-2xl font-bold text-green-600">0</p>
      </div>
      <div class="card bg-white p-4">
        <p class="text-black">Rejected</p>
        <p id="rejectedCount" class="text-2xl font-bold text-red-600">0</p>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>

</html>
